name: Tests

# Pull requests only, and ubuntu-latest only. The self-hosted runner is a
# machine in a house and every repository in this organisation is public; a
# fork's pull request running on it is the standard catastrophe. No
# pull_request-triggered job may ever name it.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # tests/test_migrations_build_the_schema.py opens an administrative
      # connection and builds a scratch database from zero. ubuntu-latest
      # ships PostgreSQL but does not run it, so without this service the
      # test errors rather than skipping.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The runner has no .env, so app/config.py would fall back to its own
      # defaults - user `travel` with an empty password - and authentication
      # would fail even with the service healthy. Throwaway values for a
      # throwaway database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel
      APP_ENV: development
    steps:
      - uses: actions/checkout@v7

      # The bit has been lost six times across these repositories: both
      # development machines have core.fileMode=false, so git records 100644
      # for a file the filesystem calls executable and nothing in the working
      # tree disagrees. The box then cannot run the hook, and since the
      # registry declares migrations: true, that refuses EVERY deploy.
      #
      # ls-tree, not ls-files: the latter reads the index, which already
      # reflects a chmod that was never committed.
      #
      # The backup scripts fail the same way, later and more quietly: the
      # timer's run is refused at 04:20 with nobody watching.
      - name: Deploy scripts must be executable in the commit
        run: |
          for path in deploy/migrations deploy/backup/sheets.sh deploy/backup/install.sh; do
            mode=$(git ls-tree HEAD -- "$path" | awk '{print $1}')
            echo "$path is $mode"
            test "$mode" = "100755"
          done

      - uses: actions/setup-python@v7
        with:
          # Same interpreter as the runtime image (dockerfile: python:3.13-slim).
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint backend
        run: ruff check .

      - name: Lint shell scripts
        run: shellcheck deploy/migrations entrypoint.sh

      - name: Run the tests
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      # The due-now boundaries are pure functions with no server behind them,
      # so nothing in the Python suite covers them. They are only wrong on the
      # evening they matter, which is the worst time to find out.
      - name: Test frontend
        run: npm test
        working-directory: frontend

      # dockerfile builds the frontend, so without this a bundle that does not
      # compile is found by the deploy rather than by the pull request.
      - name: Build the frontend
        run: npm run build
        working-directory: frontend
